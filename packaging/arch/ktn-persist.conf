# Shipped by xdg-desktop-portal-wlr-ktn.
#
# xdpw only issues screencast restore tokens when XDPW_PERSIST_MODE is set; without it
# the ktn window-restore patch never fires. Chromium/Electron apps reopen the portal
# session when a share actually starts (and on every quality change) and pass the first
# session's token, so with this set a share prompts once instead of two or three times.
# transient = the token is only valid while the sharing app keeps running.
[Service]
Environment=XDPW_PERSIST_MODE=transient
